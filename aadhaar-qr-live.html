<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Loading Aadhaar Secure QR Reader…</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f8;color:#111}.box{max-width:520px;padding:28px;text-align:center}.spin{width:34px;height:34px;border:4px solid #ddd;border-top-color:#111;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#a00;white-space:pre-wrap}</style>
</head>
<body><div class="box" id="status"><div class="spin"></div><strong>Loading Secure QR Reader…</strong><p>The Aadhaar QR is processed in your browser.</p></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    let b64='';
    for(let i=0;i<5;i++){
      const name=`.deploy/aadhaar/site.part${String(i).padStart(2,'0')}`;
      const r=await fetch(name,{cache:'no-store'});
      if(!r.ok) throw new Error(`Could not load ${name} (${r.status})`);
      b64+=(await r.text()).replace(/\s+/g,'');
    }
    const compressed=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support the required gzip decoder. Please use a current Chrome/Edge/Safari browser.');
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const tar=new Uint8Array(await new Response(stream).arrayBuffer());
    const td=new TextDecoder();
    const files=new Map();
    let off=0;
    while(off+512<=tar.length){
      const h=tar.subarray(off,off+512);
      if(h.every(v=>v===0)) break;
      const z=h.indexOf(0);
      const name=td.decode(h.subarray(0,z<0?100:Math.min(z,100)));
      const sizeText=td.decode(h.subarray(124,136)).replace(/\0/g,'').trim();
      const size=parseInt(sizeText||'0',8);
      if(!Number.isFinite(size)||size<0) throw new Error('Invalid deployment archive.');
      const start=off+512,end=start+size;
      files.set(name,tar.slice(start,end));
      off=start+Math.ceil(size/512)*512;
    }
    const find=s=>[...files.keys()].find(k=>k===s||k.endsWith('/'+s));
    const indexKey=find('index.html');
    const appKey=find('app.bundle.js');
    if(!indexKey||!appKey) throw new Error('Scanner files were not found in the deployment archive.');
    let html=td.decode(files.get(indexKey));
    const app=td.decode(files.get(appKey)).replace(/<\/script/gi,'<\\/script');
    const patterns=[
      /<script([^>]*?)src=["']\.\/app\.bundle\.js["']([^>]*)><\/script>/i,
      /<script([^>]*?)src=["']app\.bundle\.js["']([^>]*)><\/script>/i
    ];
    let replaced=false;
    for(const p of patterns){if(p.test(html)){html=html.replace(p,`<script>${app}<\/script>`);replaced=true;break;}}
    if(!replaced) html=html.replace(/<\/body>/i,`<script>${app}<\/script></body>`);
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);
    status.innerHTML='<h2>Could not load the scanner</h2><div class="err"></div>';
    status.querySelector('.err').textContent=e&&e.message?e.message:String(e);
  }
})();
</script>
</body>
</html>
